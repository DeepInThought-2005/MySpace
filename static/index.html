<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Planner</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Study Planner</h1>
    <div class="sync">
      <span id="sync-status" class="sync-status">Loading…</span>
      <button id="refresh-btn" class="btn" type="button" title="Fetch Moodle now">
        <span class="spin" aria-hidden="true">↻</span> Refresh
      </button>
      <button id="add-task-btn" class="btn primary" type="button">+ Task</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section>
        <h2>Next 14 days</h2>
        <ul id="upcoming" class="upcoming"></ul>
      </section>

      <section>
        <h2>Courses</h2>
        <ul id="courses" class="courses"></ul>
        <label class="toggle"><input type="checkbox" id="show-opens"> Show "opens" events</label>
      </section>

      <section>
        <h2>My tasks</h2>
        <ul id="tasks" class="tasks"></ul>
      </section>
    </aside>

    <div class="calendar-wrap">
      <div id="calendar"></div>
    </div>
  </main>

  <!-- Add / edit task -->
  <dialog id="task-dialog">
    <form id="task-form" method="dialog">
      <h2 id="task-dialog-title">New task</h2>

      <label>Title
        <input name="title" required maxlength="120" placeholder="e.g. Review lecture notes">
      </label>

      <div class="row">
        <label>Repeats
          <select name="freq">
            <option value="once">Once</option>
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label class="interval-field">Every
          <span class="inline"><input name="interval" type="number" min="1" max="52" value="1"> <span id="interval-unit">week(s)</span></span>
        </label>
      </div>

      <fieldset class="weekdays" id="weekdays">
        <legend>On</legend>
        <label><input type="checkbox" name="byDay" value="1">Mo</label>
        <label><input type="checkbox" name="byDay" value="2">Tu</label>
        <label><input type="checkbox" name="byDay" value="3">We</label>
        <label><input type="checkbox" name="byDay" value="4">Th</label>
        <label><input type="checkbox" name="byDay" value="5">Fr</label>
        <label><input type="checkbox" name="byDay" value="6">Sa</label>
        <label><input type="checkbox" name="byDay" value="0">Su</label>
      </fieldset>

      <div class="row">
        <label>Starts
          <input name="startDate" type="date" required>
        </label>
        <label><span>Ends <small>(optional)</small></span>
          <input name="endDate" type="date">
        </label>
      </div>

      <div class="row">
        <label><span>Time <small>(blank = all day)</small></span>
          <input name="time" type="time">
        </label>
        <label>Duration (min)
          <input name="durationMin" type="number" min="5" step="5" value="60">
        </label>
      </div>

      <div class="row">
        <label>Colour
          <input name="color" type="color" value="#7c5cff">
        </label>
      </div>

      <label>Notes
        <textarea name="notes" rows="2"></textarea>
      </label>

      <p id="task-error" class="error" hidden></p>

      <div class="actions">
        <button type="button" class="btn danger" id="task-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="task-cancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Event details -->
  <dialog id="event-dialog">
    <div class="event-detail">
      <p id="ev-course" class="ev-course"></p>
      <h2 id="ev-title"></h2>
      <p id="ev-when" class="ev-when"></p>
      <div id="ev-desc" class="ev-desc"></div>
      <label class="toggle"><input type="checkbox" id="ev-done"> Done</label>
      <div class="actions">
        <button type="button" class="btn" id="ev-edit" hidden>Edit task</button>
        <span class="spacer"></span>
        <button type="button" class="btn primary" id="ev-close">Close</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
